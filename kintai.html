<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>勤怠システム｜株式会社ノムラ化成（社内用）</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f6f9; }
    /* 勤怠アプリを画面いっぱいに埋め込む（Google Apps Script のバナーを表に出さないため iframe 表示） */
    #kintaiFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .fallback {
      position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
      font: 13px -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; color: #9aa4b2;
      pointer-events: none;
    }
    .fallback a { color: #1f4e79; pointer-events: auto; }
  </style>
</head>
<body>
  <iframe id="kintaiFrame"
    src="https://script.google.com/macros/s/AKfycbwZmg4WMXiGxNMcSXPLRO82DApuFXektpKEVlLi-4E-yCfElHvj8ujZ3j25udK_IZU/exec"
    title="ノムラ化成 勤怠システム"
    allow="clipboard-write; camera; microphone"></iframe>
  <div class="fallback">
    表示されない場合は
    <a href="https://script.google.com/macros/s/AKfycbwZmg4WMXiGxNMcSXPLRO82DApuFXektpKEVlLi-4E-yCfElHvj8ujZ3j25udK_IZU/exec" target="_blank" rel="noopener">こちらから直接開く</a>
  </div>
</body>
</html>
